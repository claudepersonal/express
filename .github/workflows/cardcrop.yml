name: Wrestling CardCrop checks
on:
  push:
    branches: [master, 'codex/cardchop-gui-workbench-*']
    paths: ['cardcrop/**', '.github/workflows/cardcrop.yml']
  pull_request:
    paths: ['cardcrop/**', '.github/workflows/cardcrop.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m pip install -r cardcrop/requirements.txt
      - run: npm install --prefix cardcrop --no-audit --no-fund
      - run: npm install --prefix cardcrop/frontend --no-audit --no-fund
      - run: npm run build --prefix cardcrop
      - run: npm test --prefix cardcrop
      - run: node --check cardcrop/vlm_bridge.cjs && node --check cardcrop/frontend/src/batch-workbench.js
      - run: cd cardcrop && npx playwright install --with-deps chromium
      - run: npm run test:gui --prefix cardcrop
