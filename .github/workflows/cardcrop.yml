name: Wrestling CardCrop checks
on:
  push:
    branches: [master]
    paths: ['cardcrop/**', '.github/workflows/cardcrop.yml']
  pull_request:
    paths: ['cardcrop/**', '.github/workflows/cardcrop.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: python -m pip install opencv-python-headless numpy Pillow pytesseract
      - run: npm install --prefix cardcrop --no-audit --no-fund
      - run: npm test --prefix cardcrop
      - run: node --check cardcrop/server.js && node --check cardcrop/vlm_ocr.js

  cnn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install opencv-python-headless numpy
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s cardcrop/tests -p 'test_cnn.py' -v
